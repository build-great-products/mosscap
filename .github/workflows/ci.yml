name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pi-extension/pnpm-lock.yaml
      - run: cd pi-extension && pnpm install --frozen-lockfile && pnpm test && pnpm typecheck
      - run: gofmt -w $(find . -name '*.go' -not -path './.git/*')
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=1 go test -race ./...
      - run: go build ./cmd/mosscap
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
